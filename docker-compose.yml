services:
  # Primary Relational Database (PostgreSQL 16)
  postgres:
    image: postgres:16-alpine
    container_name: nutridaily-postgres
    restart: always
    environment:
      POSTGRES_USER: nutridaily_user
      POSTGRES_PASSWORD: nutridaily_secure_password_2026
      POSTGRES_DB: nutridaily_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutridaily_user -d nutridaily_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # In-Memory Cache & BullMQ Task Queue Engine (Redis 7)
  redis:
    image: redis:7-alpine
    container_name: nutridaily-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Back-End REST API & Real-time WebSockets Server (NestJS)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nutridaily-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "postgresql://nutridaily_user:nutridaily_secure_password_2026@postgres:5432/nutridaily_db?schema=public"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: "nutridaily-super-secret-jwt-key-2026-production"
      JWT_REFRESH_SECRET: "nutridaily-super-refresh-jwt-key-2026"
      DATA_ENCRYPTION_KEY: "nutridaily-aes256-gcm-key-uupdp-32b!"
      MIDTRANS_SERVER_KEY: "SB-Mid-server-DemoSecretKey2026"
      MIDTRANS_CLIENT_KEY: "SB-Mid-client-DemoClientKey2026"
      WHATSAPP_CLOUD_ACCESS_TOKEN: "EAA..."
      WHATSAPP_PHONE_NUMBER_ID: "109823487234"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Front-End Web Platform & PWA (Next.js 14 App Router)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nutridaily-frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: "http://backend:4000"
      NEXT_PUBLIC_WS_URL: "ws://backend:4000"
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # NGINX Edge Reverse Proxy & SSL Termination
  nginx:
    image: nginx:alpine
    container_name: nutridaily-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
