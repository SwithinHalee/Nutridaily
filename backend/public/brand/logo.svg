<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none" role="img" aria-label="NutriDaily Concept 2: The Tri-Macro Plate Emblem">
  <!-- KONSEP 2: THE TRI-MACRO PLATE EMBLEM -->
  <!-- Geometri murni: Lingkaran kalori utuh, mangkuk takaran gizi presisi, dan helai daun ganda -->
  <g>
    <!-- Lingkaran Luar Presisi (Metabolisme Seimbang) -->
    <circle cx="50" cy="50" r="43" stroke="#2C4A3E" stroke-width="4.5" />
    
    <!-- Mangkuk Geometris Porsi Bersih -->
    <path d="M22 52 C 22 71, 34 81, 50 81 C 66 81, 78 71, 78 52 Z" fill="#2C4A3E" />
    
    <!-- Garis Ruang Negatif Pembatas Mangkuk -->
    <line x1="26" y1="50" x2="74" y2="50" stroke="#FDFBF7" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Daun Kiri (Forest Avocado) -->
    <path d="M50 48 C 43 38, 37 26, 50 16 C 58 26, 54 38, 50 48 Z" fill="#2C4A3E" />
    
    <!-- Daun Kanan (Warm Terracotta Accent) -->
    <path d="M52 48 C 58 40, 68 32, 66 18 C 54 22, 52 38, 52 48 Z" fill="#D96B43" />
  </g>
</svg>
